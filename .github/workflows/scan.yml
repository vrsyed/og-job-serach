name: Scan job boards

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours - edit to taste
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scan and tailor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: python scan_and_tailor.py

      - name: Commit updated results
        run: |
          git config user.name "job-scan-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/seen.json
          git diff --quiet --cached || git commit -m "Update scanned jobs [automated]"
          git push
